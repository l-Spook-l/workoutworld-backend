services:
  db:
    image: postgres:15.3-alpine3.18
    container_name: db_app
    command: -p 5435
    restart: always
    expose:
      - 5435
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env-non-dev
    networks:
      - mynetwork

  redis:
    image: redis:7
    container_name: redis_app
    ports:
      - "6379:6379"
    expose:
      - "6379"
    networks:
      - mynetwork
    depends_on:
      - db

  server_app:
    build:
      context: .
    env_file:
      - .env-non-dev
    container_name: fastapi_app
#    command: ["sh", "./docker/app_run.sh"]
#    command: ./app_run.sh
    command: ["./app_run.sh"]
    ports:
      - "9999:8000"
    networks:
      - mynetwork
    depends_on:
      - redis

  celery:
    build: .
    container_name: celery_app
    command: ["./celery.sh", "celery"]
    networks:
      - mynetwork
    depends_on:
      - redis

  flower:
    build: .
    command: ["./celery.sh", "flower"]
    ports:
      - "5555:5555"
    networks:
      - mynetwork
    depends_on:
      - celery

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
#    command:
#      - "--config.file=/etc/prometheus/prometheus.yml"  # Явно указываем путь к конфигу
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # конфигурационный файл Prometheus
      - prometheus_data:/prometheus  # Volume для сохранения данных Prometheus
    ports:
      - "9090:9090"
    networks:
      - mynetwork
    depends_on:
      - server_app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana-config:/etc/grafana
    ports:
      - "3030:3000"
#    environment:
#      - .env-non-dev
    networks:
      - mynetwork
    depends_on:
      - prometheus

networks:
  mynetwork:
    driver: bridge

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  grafana-config:



